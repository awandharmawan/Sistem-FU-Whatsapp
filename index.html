<!-- ... existing code ... -->
            <div class="mt-5 sm:mt-6 flex gap-3 justify-center">
                <button type="button" id="btnCancelDelete" class="w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none sm:text-sm transition-colors">Batal</button>
                <button type="button" id="btnConfirmDelete" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-red-600 text-base font-medium text-white hover:bg-red-700 focus:outline-none sm:text-sm transition-colors">Ya, Hapus</button>
            </div>
        </div>
    </div>

    <!-- INI YANG DITAMBAHKAN: Library SheetJS untuk membaca file Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // === FIREBASE CLOUD DATABASE INIT ===
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        let currentUser = null;

        // === STATE MANAGEMENT ===
        let customers = [];
        let templates = [];
        
        let itemToDeleteId = null;
        let itemToDeleteType = null;
        let selectedCustomers = new Set();

        // === DOM ELEMENTS ===
        const customerTableBody = document.getElementById('customerTableBody');
        const searchInput = document.getElementById('searchInput');
        const statusMessage = document.getElementById('statusMessage');
        
        const templateFormContainer = document.getElementById('templateFormContainer');
        const btnNewTemplate = document.getElementById('btnNewTemplate');
        const btnSaveTemplate = document.getElementById('btnSaveTemplate');
        const btnCancelTemplate = document.getElementById('btnCancelTemplate');
        const templateList = document.getElementById('templateList');
        const templateNameInput = document.getElementById('templateName');
        const templateContentInput = document.getElementById('templateContent');
        const editTemplateId = document.getElementById('editTemplateId');

        const deleteModal = document.getElementById('deleteModal');
        const btnCancelDelete = document.getElementById('btnCancelDelete');
        const btnConfirmDelete = document.getElementById('btnConfirmDelete');
        const deleteConfirmText = document.getElementById('deleteConfirmText');

        // === AUTH & REALTIME SYNC ===
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth error:", error);
                showNotification("Gagal terhubung ke database cloud", "error");
            }
        };

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                setupRealtimeListeners();
            }
        });

        function setupRealtimeListeners() {
            // Listen ke koleksi Templates secara real-time
            const templatesRef = collection(db, 'artifacts', appId, 'public', 'data', 'templates');
            onSnapshot(templatesRef, (snapshot) => {
                templates = [];
                let isFirstLoad = snapshot.size === 0;
                
                snapshot.forEach(doc => {
                    templates.push({ id: doc.id, ...doc.data() });
                });

                if (isFirstLoad) {
                    seedDefaultTemplates();
                } else {
                    renderTemplates();
                    updateTemplateDropdown();
                    if(customers.length > 0) renderCustomers(searchInput.value);
                }
            }, (error) => console.error("Template Sync Error:", error));

            // Listen ke koleksi Customers secara real-time
            const customersRef = collection(db, 'artifacts', appId, 'public', 'data', 'customers');
            onSnapshot(customersRef, (snapshot) => {
                customers = [];
                snapshot.forEach(doc => {
                    customers.push({ id: doc.id, ...doc.data() });
                });
                
                // Sortir dari yang terbaru masuk
                customers.sort((a, b) => b.createdAt - a.createdAt);
                
                renderCustomers(searchInput.value);
                updateDashboard();
            }, (error) => {
                console.error("Customer Sync Error:", error);
                showNotification("Terputus dari database", "error");
            });
        }

        function seedDefaultTemplates() {
            const defaults = [
                { id: Date.now().toString() + '1', name: 'Sapaan Awal', content: 'Halo {nama}, perkenalkan saya dari [Nama Toko]. Apakah Anda ada waktu sebentar?' },
                { id: Date.now().toString() + '2', name: 'Follow Up Repeat Order', content: 'Halo {nama}, semoga harinya menyenangkan! Kami lihat sebelumnya Kakak pernah membeli {produk}. Apakah produknya sudah habis? Saat ini kami sedang ada promo khusus pelanggan lama jika ingin memesan ulang.' },
                { id: Date.now().toString() + '3', name: 'Promo Khusus', content: 'Kabar gembira untuk {nama}! Kami punya penawaran spesial khusus untuk Anda hari ini.' }
            ];
            defaults.forEach(t => {
                setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'templates', t.id), { name: t.name, content: t.content });
            });
        }

        // Jalankan Autentikasi dan Event Listener
        initAuth();
        setupEventListeners();

        // === UTILITY FUNCTIONS ===
        function showNotification(message, type = 'success') {
            statusMessage.innerHTML = type === 'success' 
                ? `<i class="fas fa-check-circle text-whatsapp"></i> ${message}`
                : `<i class="fas fa-info-circle text-blue-500"></i> ${message}`;
            
            statusMessage.className = `mb-4 p-3 rounded-lg text-sm flex items-center gap-2 ${
                type === 'success' ? 'bg-green-50 text-green-800 border border-green-200' : 'bg-red-50 text-red-800 border border-red-200'
            }`;
            statusMessage.classList.remove('hidden');
            
            setTimeout(() => {
                statusMessage.classList.add('hidden');
            }, 3000);
        }

        function formatPhone(phone) {
            let cleaned = ('' + phone).replace(/\D/g, '');
            if (cleaned.startsWith('0')) {
                cleaned = cleaned.substring(1);
            }
            return cleaned;
        }

        function formatDate(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        // === DASHBOARD FUNCTIONS ===
        function updateDashboard() {
            const totalPelanggan = customers.length;
            const contactedCount = customers.filter(c => c.status === 'contacted').length;
            const progressPct = totalPelanggan > 0 ? Math.round((contactedCount / totalPelanggan) * 100) : 0;
            
            const totalValue = customers.reduce((sum, c) => sum + (c.transactionValue || 0), 0);
            
            const staffStats = {};
            customers.forEach(c => {
                const staff = c.staffName || 'Tanpa User';
                if(!staffStats[staff]) staffStats[staff] = { total: 0, contacted: 0, value: 0 };
                staffStats[staff].total += 1;
                if(c.status === 'contacted') staffStats[staff].contacted += 1;
                staffStats[staff].value += (c.transactionValue || 0);
            });

            let staffListHTML = '';
            const sortedStaff = Object.entries(staffStats).sort((a, b) => b[1].contacted - a[1].contacted);
            
            const currencyCompact = new Intl.NumberFormat('id-ID', { notation: "compact", compactDisplay: "short", style: "currency", currency: "IDR" });

            if(sortedStaff.length > 0) {
                staffListHTML = sortedStaff.map(([name, stat]) => `
                    <div class="flex justify-between items-center text-xs mb-1">
                        <span class="font-medium text-gray-700 truncate w-24" title="${name}">${name}</span>
                        <span class="text-green-600 font-bold px-1">${stat.contacted}/${stat.total} FU</span>
                        <span class="text-blue-600 font-medium">${currencyCompact.format(stat.value)}</span>
                    </div>
                `).join('');
            }

            const elTotal = document.getElementById('dashTotalPelanggan');
            const elProgress = document.getElementById('dashProgress');
            const elValue = document.getElementById('dashValue');
            const elStaffList = document.getElementById('dashStaffList');

            if(elTotal) elTotal.innerText = totalPelanggan;
            if(elProgress) elProgress.innerHTML = `${contactedCount} <span class="text-sm text-gray-500 font-normal">/ ${totalPelanggan} (${progressPct}%)</span>`;
            if(elValue) elValue.innerText = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(totalValue);
            if(elStaffList) elStaffList.innerHTML = staffListHTML || '<div class="text-xs text-gray-400 italic">Belum ada data</div>';
        }

        // === TEMPLATE MANAGEMENT ===
        function renderTemplates() {
            if (templates.length === 0) {
                templateList.innerHTML = '<p class="text-sm text-gray-500 text-center py-2">Belum ada template. Buat baru untuk memulai.</p>';
                return;
            }

            templateList.innerHTML = templates.map(t => `
                <div class="bg-white border border-gray-200 rounded p-2 mb-2 flex justify-between items-start group">
                    <div class="pr-2 w-full">
                        <div class="font-medium text-sm text-gray-800">${t.name}</div>
                        <div class="text-xs text-gray-500 truncate mt-0.5" title="${t.content}">${t.content}</div>
                    </div>
                    <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="editTemplate('${t.id}')" class="text-blue-500 hover:text-blue-700 p-1" title="Edit">
                            <i class="fas fa-edit text-xs"></i>
                        </button>
                        <button onclick="confirmDelete('${t.id}', 'template')" class="text-red-500 hover:text-red-700 p-1" title="Hapus">
                            <i class="fas fa-trash text-xs"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function updateTemplateDropdown() {
            const bulkSelect = document.getElementById('bulkTemplateSelect');
            if (bulkSelect) {
                const currentValue = bulkSelect.value;
                bulkSelect.innerHTML = '<option value="">-- Set Template Sekaligus --</option>' + 
                    templates.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
                if (templates.find(t => t.id === currentValue)) bulkSelect.value = currentValue;
            }
        }

        function saveTemplate() {
            if (!currentUser) return;
            const name = templateNameInput.value.trim();
            const content = templateContentInput.value.trim();
            const editId = editTemplateId.value;

            if (!name || !content) {
                alert("Nama dan isi template harus diisi!");
                return;
            }

            const idToSave = editId || Date.now().toString();
            // Simpan ke Cloud DB
            setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'templates', idToSave), {
                name, content
            });

            resetTemplateForm();
            showNotification(editId ? "Template diperbarui" : "Template ditambahkan");
        }

        function editTemplate(id) {
            const template = templates.find(t => t.id === id);
            if (template) {
                editTemplateId.value = template.id;
                templateNameInput.value = template.name;
                templateContentInput.value = template.content;
                templateFormContainer.classList.remove('hidden');
                btnNewTemplate.classList.add('hidden');
                templateNameInput.focus();
            }
        }
        window.editTemplate = editTemplate; 

        function resetTemplateForm() {
            editTemplateId.value = '';
            templateNameInput.value = '';
            templateContentInput.value = '';
            templateFormContainer.classList.add('hidden');
            btnNewTemplate.classList.remove('hidden');
        }

        // === CUSTOMER MANAGEMENT ===
        function renderCustomers(searchTerm = '') {
            let filteredCustomers = customers;
            
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                filteredCustomers = customers.filter(c => 
                    c.name.toLowerCase().includes(term) || 
                    c.phone.includes(term)
                );
            }

            if (filteredCustomers.length === 0) {
                customerTableBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="px-6 py-10 text-center text-gray-500">
                            <i class="fas ${searchTerm ? 'fa-search' : 'fa-inbox'} text-4xl mb-3 text-gray-300 block"></i>
                            <p>${searchTerm ? 'Data tidak ditemukan.' : 'Belum ada pelanggan.'}</p>
                            ${!searchTerm ? '<p class="text-sm mt-1">Silakan <b>Import Excel</b> untuk memulai Follow Up.</p>' : ''}
                        </td>
                    </tr>
                `;
                return;
            }

            customerTableBody.innerHTML = filteredCustomers.map(c => {
                const statusClass = c.status === 'contacted' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800';
                const statusText = c.status === 'contacted' ? 'Dihubungi' : 'Menunggu';
                const statusIcon = c.status === 'contacted' ? 'fa-check-double' : 'fa-clock';
                const isSelected = selectedCustomers.has(c.id);
                
                let templateName = '-';
                if (c.templateId) {
                    const t = templates.find(temp => temp.id === c.templateId);
                    if (t) templateName = t.name;
                }

                return `
                <tr class="hover:bg-gray-50 transition-colors ${isSelected ? 'bg-blue-50/50' : ''}">
                    <td class="px-4 py-3">
                        <input type="checkbox" onclick="toggleSelect('${c.id}')" ${isSelected ? 'checked' : ''} class="rounded border-gray-300 text-whatsapp focus:ring-whatsapp cursor-pointer w-4 h-4 mt-1">
                    </td>
                    <td class="px-4 py-3 whitespace-nowrap">
                        <div class="flex items-center">
                            <div class="flex-shrink-0 h-10 w-10 bg-gradient-to-br from-whatsapp-light to-whatsapp rounded-full flex items-center justify-center text-white font-bold text-lg">
                                ${c.name.charAt(0).toUpperCase()}
                            </div>
                            <div class="ml-3">
                                <div class="text-sm font-medium text-gray-900">${c.name}</div>
                                <div class="text-xs text-gray-500 flex items-center gap-1">
                                    <i class="fas fa-phone-alt text-[10px]"></i> +62${c.phone}
                                </div>
                            </div>
                        </div>
                    </td>
                    <td class="px-4 py-3">
                        <div class="text-sm font-medium text-blue-700 line-clamp-1" title="${c.product || ''}"><i class="fas fa-box text-xs mr-1 opacity-70"></i>${c.product || 'Belum ada produk'}</div>
                        <div class="text-sm text-gray-900 line-clamp-1 mt-1" title="${c.notes}">${c.notes || '-'}</div>
                        <div class="text-xs text-gray-500 mt-1">User: <span class="font-medium text-gray-700">${c.staffName || '-'}</span> | Tpl: ${templateName}</div>
                    </td>
                    <td class="px-4 py-3 whitespace-nowrap text-center">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${statusClass} flex items-center justify-center gap-1 w-max mx-auto">
                            <i class="fas ${statusIcon} text-[10px]"></i> ${statusText}
                        </span>
                        ${c.lastContacted ? `<div class="text-[10px] text-gray-400 mt-1" title="${formatDate(c.lastContacted)}">${new Date(c.lastContacted).toLocaleDateString()}</div>` : ''}
                    </td>
                    <td class="px-4 py-3 whitespace-nowrap text-right text-sm font-medium">
                        <div class="flex items-center justify-end gap-2">
                            <button onclick="sendWA('${c.id}')" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-whatsapp hover:bg-whatsapp-dark text-white rounded-md transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-1 focus:ring-whatsapp">
                                <i class="fab fa-whatsapp"></i> Chat WA
                            </button>
                            <div class="relative group">
                                <button class="p-1.5 text-gray-400 hover:text-gray-600 rounded-md hover:bg-gray-100 transition-colors">
                                    <i class="fas fa-ellipsis-v"></i>
                                </button>
                                <div class="absolute right-0 mt-1 w-32 bg-white rounded-md shadow-lg border border-gray-100 hidden group-hover:block group-focus-within:block z-10">
                                    <div class="py-1">
                                        <button onclick="toggleStatus('${c.id}')" class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                                            <i class="fas fa-sync-alt w-4 mr-1 text-blue-500"></i> Ubah Status
                                        </button>
                                        <button onclick="confirmDelete('${c.id}', 'customer')" class="block w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50">
                                            <i class="fas fa-trash-alt w-4 mr-1"></i> Hapus
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
            `}).join('');
        }

        function sendWA(id) {
            if (!currentUser) return;
            const customer = customers.find(c => c.id === id);
            if (!customer) return;

            let message = '';
            if (customer.templateId) {
                const template = templates.find(t => t.id === customer.templateId);
                if (template) {
                    message = template.content.replace(/{nama}/gi, customer.name);
                    message = message.replace(/{produk}/gi, customer.product || 'produk kami');
                }
            }

            const encodedMessage = encodeURIComponent(message);
            const targetPhone = `62${customer.phone}`;
            const waUrl = `https://wa.me/${targetPhone}${encodedMessage ? `?text=${encodedMessage}` : ''}`;
            
            window.open(waUrl, '_blank');

            // Simpan status baru ke Cloud
            setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', id), {
                status: 'contacted',
                lastContacted: new Date().getTime()
            }, { merge: true });
            
            showNotification(`Membuka WhatsApp untuk ${customer.name}`, 'info');
        }
        window.sendWA = sendWA;

        function toggleStatus(id) {
            if (!currentUser) return;
            const customer = customers.find(c => c.id === id);
            if (customer) {
                const newStatus = customer.status === 'pending' ? 'contacted' : 'pending';
                setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', id), {
                    status: newStatus
                }, { merge: true });
            }
        }
        window.toggleStatus = toggleStatus;

        function confirmDelete(id, type) {
            itemToDeleteId = id;
            itemToDeleteType = type;
            
            if (type === 'customer') {
                const c = customers.find(x => x.id === id);
                deleteConfirmText.innerHTML = `Hapus data pelanggan <b>${c.name}</b>?<br>Tindakan ini tidak dapat dibatalkan.`;
            } else {
                const t = templates.find(x => x.id === id);
                deleteConfirmText.innerHTML = `Hapus template <b>${t.name}</b>?<br>Tindakan ini tidak dapat dibatalkan.`;
            }
            
            deleteModal.classList.remove('hidden');
        }
        window.confirmDelete = confirmDelete;

        function executeDelete() {
            if (!itemToDeleteId || !currentUser) return;

            if (itemToDeleteType === 'customer') {
                deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', itemToDeleteId));
                showNotification('Data pelanggan dihapus.');
                selectedCustomers.delete(itemToDeleteId);
                updateBulkActions();
            } else if (itemToDeleteType === 'template') {
                deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'templates', itemToDeleteId));
                customers.forEach(c => {
                    if (c.templateId === itemToDeleteId) {
                        setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', c.id), { templateId: null }, { merge: true });
                    }
                });
                showNotification('Template dihapus.');
            }

            closeDeleteModal();
        }

        function closeDeleteModal() {
            deleteModal.classList.add('hidden');
            itemToDeleteId = null;
            itemToDeleteType = null;
        }

        function setupEventListeners() {
            searchInput.addEventListener('input', (e) => {
                renderCustomers(e.target.value);
            });

            btnNewTemplate.addEventListener('click', () => {
                resetTemplateForm();
                templateFormContainer.classList.remove('hidden');
                btnNewTemplate.classList.add('hidden');
                templateNameInput.focus();
            });

            btnCancelTemplate.addEventListener('click', resetTemplateForm);
            btnSaveTemplate.addEventListener('click', saveTemplate);

            btnCancelDelete.addEventListener('click', closeDeleteModal);
            btnConfirmDelete.addEventListener('click', executeDelete);
            
            deleteModal.addEventListener('click', (e) => {
                if (e.target === deleteModal) closeDeleteModal();
            });

            document.getElementById('excelInput')?.addEventListener('change', handleExcelImport);
            
            document.getElementById('bulkTemplateSelect')?.addEventListener('change', (e) => {
                const templateId = e.target.value;
                if(!templateId || !currentUser) return;
                
                selectedCustomers.forEach(id => {
                    setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', id), {
                        templateId: templateId
                    }, { merge: true });
                });
                
                showNotification(`Template diterapkan ke ${selectedCustomers.size} pelanggan terpilih`);
                e.target.value = ''; // Reset
            });

            document.getElementById('selectAll')?.addEventListener('change', (e) => {
                if (e.target.checked) {
                    const searchTerm = searchInput.value.toLowerCase();
                    const filtered = customers.filter(c => 
                        c.name.toLowerCase().includes(searchTerm) || 
                        c.phone.includes(searchTerm)
                    );
                    filtered.forEach(c => selectedCustomers.add(c.id));
                } else {
                    selectedCustomers.clear();
                }
                updateBulkActions();
                renderCustomers(searchInput.value);
            });
        }

        // === BULK SELECTION & EXCEL FUNCTIONS ===
        function toggleSelect(id) {
            if (selectedCustomers.has(id)) {
                selectedCustomers.delete(id);
            } else {
                selectedCustomers.add(id);
            }
            updateBulkActions();
            renderCustomers(searchInput.value);
        }
        window.toggleSelect = toggleSelect;

        function updateBulkActions() {
            const bulkActions = document.getElementById('bulkActions');
            const selectedCount = document.getElementById('selectedCount');
            const selectAllCheckbox = document.getElementById('selectAll');
            
            if (selectedCustomers.size > 0) {
                bulkActions.classList.remove('hidden');
                selectedCount.textContent = selectedCustomers.size;
            } else {
                bulkActions.classList.add('hidden');
                if(selectAllCheckbox) selectAllCheckbox.checked = false;
            }
        }

        function deleteSelected() {
            if (!currentUser) return;
            if(confirm(`Yakin ingin menghapus ${selectedCustomers.size} pelanggan yang dipilih?`)) {
                selectedCustomers.forEach(id => {
                    deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', id));
                });
                selectedCustomers.clear();
                updateBulkActions();
                showNotification('Pelanggan terpilih berhasil dihapus');
            }
        }
        window.deleteSelected = deleteSelected;

        function handleExcelImport(e) {
            if (!currentUser) {
                showNotification("Tunggu hingga terhubung ke server", "error");
                return;
            }
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    showNotification("Sedang menyimpan ke Database Cloud...", "info");
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet);
                    
                    if (jsonData.length === 0) {
                        showNotification('File Excel kosong atau format tidak sesuai', 'error');
                        return;
                    }

                    let importedCount = 0;
                    jsonData.forEach((row, index) => {
                        const name = row['NAMA PELANGGAN'] || row['Nama'] || row['Nama Pelanggan'] || row['Name'] || Object.values(row)[0]; 
                        let phone = row['NOMOR HP'] || row['No WA'] || row['Nomor WA'] || row['Phone'] || row['WhatsApp'] || row['No HP'] || row['Telp'];
                        const product = row['NAMA OBAT'] || row['Produk'] || row['Product'] || row['Barang'] || row['Pesanan'] || '';
                        
                        const staffName = row['NAMA USER'] || row['User'] || row['Staff'] || 'Tanpa User';
                        const rawTotal = row['TOTAL TRANSAKSI'] || row['Total'] || row['Nominal'] || 0;
                        const transactionValue = parseFloat(String(rawTotal).replace(/[^\d]/g, '')) || 0;

                        let extraNotes = [];
                        if(row['TANGGAL TRANSAKSI']) extraNotes.push(`Tgl: ${row['TANGGAL TRANSAKSI']}`);
                        if(row['QUANTITY']) extraNotes.push(`Qty: ${row['QUANTITY']}`);
                        if(row['HARGA OBAT']) extraNotes.push(`Harga: ${row['HARGA OBAT']}`);
                        if(row['TOTAL TRANSAKSI']) extraNotes.push(`Total: ${row['TOTAL TRANSAKSI']}`);
                        
                        const originalNotes = row['Catatan'] || row['Notes'] || '';
                        const notes = originalNotes ? `${originalNotes}. ${extraNotes.join(' | ')}` : extraNotes.join(' | ');

                        if (name && phone) {
                            const cleanPhone = formatPhone(phone);
                            // Bikin ID unik untuk database cloud
                            const newId = Date.now().toString() + index.toString() + Math.floor(Math.random()*1000).toString();
                            
                            const newCustomer = {
                                name: String(name).trim(),
                                phone: cleanPhone,
                                product: String(product).trim(),
                                templateId: null,
                                notes: String(notes).trim(),
                                status: 'pending',
                                createdAt: new Date().getTime(),
                                lastContacted: null,
                                staffName: String(staffName).trim(),
                                transactionValue: transactionValue
                            };
                            
                            // Tulis ke Firebase Cloud Storage
                            setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', newId), newCustomer);
                            importedCount++;
                        }
                    });

                    showNotification(`Berhasil mengimpor ${importedCount} pelanggan ke Cloud`);
                } catch (err) {
                    console.error(err);
                    showNotification('Terjadi kesalahan saat membaca file', 'error');
                } finally {
                    e.target.value = ''; 
                }
            };
            reader.readAsArrayBuffer(file);
        }

    </script>
    </body>
